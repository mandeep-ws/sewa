version: '3.8'

# Windows-specific Docker Compose configuration
services:
  sewa-app:
    build: .
    container_name: sewa-book-automation-windows
    ports:
      - "8501:8501"
    volumes:
      # Windows path format for volume mounts
      - .\data:/app/data
      - .\exports:/app/exports
      - .\All_Sent_Records.xlsx:/app/All_Sent_Records.xlsx
      - .\Duplicate_Transactions.xlsx:/app/Duplicate_Transactions.xlsx
      - .\Failed_Transactions.xlsx:/app/Failed_Transactions.xlsx
      - .\config.env:/app/config.env
      - .\uploads:/app/uploads
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
      - TZ=America/New_York
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Windows-specific settings
    platform: linux/amd64
    # Ensure proper file permissions on Windows
    user: "1000:1000"
